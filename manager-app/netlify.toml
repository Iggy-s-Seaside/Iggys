[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Internal back-of-house tool — never index it (belt-and-suspenders with the
    # meta robots tag + robots.txt, in case the SPA fallback serves HTML for /robots.txt).
    X-Robots-Tag = "noindex, nofollow"

# SPA routing — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Branch deploy context — dev branch gets its own URL
[context.dev]
  command = "npm run build"
